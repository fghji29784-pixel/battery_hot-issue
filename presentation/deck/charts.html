<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"><style>
:root{
  --ground:#f4f6f8; --surface:#ffffff; --surface-2:#eef2f5;
  --ink:#0e1417; --ink-2:#3d4a52; --muted:#6b767e;
  --rule:#dde4e9; --rule-2:#c6d1d8;
  --accent:#2a78d6;        /* 제안 */
  --legacy:#eb6834;        /* 현행 */
  --good:#0ca30c; --crit:#d03b3b; --warn:#b07400;
  --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#5598e7; --seq-4:#2a78d6; --seq-5:#184f95;
  --shadow:0 1px 2px rgba(14,20,23,.05), 0 8px 24px -16px rgba(14,20,23,.22);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0e1113; --surface:#171b1e; --surface-2:#1f2429;
    --ink:#eef2f5; --ink-2:#c3ccd3; --muted:#8e99a1;
    --rule:#2a3136; --rule-2:#3a4349;
    --accent:#3987e5; --legacy:#d95926;
    --good:#0ca30c; --crit:#e66767; --warn:#fab219;
    --seq-1:#0d366b; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#9ec5f4;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0e1113; --surface:#171b1e; --surface-2:#1f2429;
  --ink:#eef2f5; --ink-2:#c3ccd3; --muted:#8e99a1;
  --rule:#2a3136; --rule-2:#3a4349;
  --accent:#3987e5; --legacy:#d95926;
  --good:#0ca30c; --crit:#e66767; --warn:#fab219;
  --seq-1:#0d366b; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#9ec5f4;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.72; margin:0;
  padding-block:0 72px; padding-left:20px; padding-right:20px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:980px; margin:0 auto}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.tnum{font-variant-numeric:tabular-nums}

/* ── 머리말 ── */
.masthead{padding-block:56px 40px; border-bottom:2px solid var(--ink)}
.kicker{
  font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:500;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 18px;
}
h1{
  font-size:clamp(30px,5.4vw,46px); line-height:1.16; font-weight:700;
  letter-spacing:-.022em; margin:0 0 18px; text-wrap:balance;
}
.standfirst{font-size:17px; color:var(--ink-2); max-width:62ch; margin:0; line-height:1.68}
.meta{
  display:flex; flex-wrap:wrap; gap:8px 26px; margin-top:26px;
  font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted);
}
.meta b{color:var(--ink-2); font-weight:500}

/* ── 헤드라인 수치 ── */
.headline-figs{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  gap:1px; background:var(--rule); border:1px solid var(--rule);
  margin-block:36px; border-radius:3px; overflow:hidden;
}
.fig{background:var(--surface); padding:20px 20px 18px}
.fig .lab{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.06em; color:var(--muted); margin-bottom:8px}
.fig .val{font-family:"IBM Plex Mono",monospace; font-size:30px; font-weight:600; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.fig .sub{font-size:12.5px; color:var(--muted); margin-top:7px; line-height:1.5}
.fig.hi .val{color:var(--accent)}
.fig.old .val{color:var(--legacy)}

/* ── 슬라이드 블록 ── */
.slide{
  background:var(--surface); border:1px solid var(--rule); border-radius:4px;
  padding:26px 26px 28px; margin-block:22px; box-shadow:var(--shadow);
}
.slide-head{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px}
.sn{
  font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600; letter-spacing:.1em;
  color:var(--surface); background:var(--ink); padding:3px 8px; border-radius:2px; white-space:nowrap;
}
.role{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
h2{font-size:clamp(20px,3vw,25px); line-height:1.3; font-weight:600; letter-spacing:-.015em; margin:8px 0 14px; text-wrap:balance}
.slide p{margin:0 0 13px; color:var(--ink-2); max-width:68ch}
.slide p:last-child{margin-bottom:0}
.slide strong{color:var(--ink); font-weight:600}

.say{
  border-left:3px solid var(--accent); background:var(--surface-2);
  padding:14px 18px; margin-top:20px; border-radius:0 3px 3px 0;
}
.say .t{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
.say p{margin:0; font-size:14.5px; color:var(--ink)}

.warnbox{border-left-color:var(--crit)}
.warnbox p{color:var(--ink)}

/* ── 차트 ── */
figure{margin:20px 0 0}
figcaption{font-size:12.5px; color:var(--muted); margin-top:11px; line-height:1.55}
.chart{width:100%; display:block; overflow:visible}
.chart text{font-family:"IBM Plex Mono",monospace; fill:var(--muted)}
.axis-line{stroke:var(--rule-2); stroke-width:1}
.grid-line{stroke:var(--rule); stroke-width:1}
.legend{display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:12px; font-size:12.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:7px}
.swatch{width:13px; height:13px; border-radius:2px; flex:none}
.swatch.ln{height:3px; border-radius:2px}

/* ── 표 ── */
.tablewrap{overflow-x:auto; margin-top:18px; border:1px solid var(--rule); border-radius:3px}
table{border-collapse:collapse; width:100%; font-size:13.5px; min-width:480px}
th,td{padding:9px 13px; text-align:right; border-bottom:1px solid var(--rule); white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{
  font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:500; letter-spacing:.05em;
  color:var(--muted); background:var(--surface-2); border-bottom:1px solid var(--rule-2);
}
tbody tr:last-child td{border-bottom:none}
td.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
tr.win td{background:color-mix(in srgb,var(--accent) 9%,transparent); font-weight:600; color:var(--ink)}
tr.win td.num{color:var(--accent)}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; padding:2px 6px; border-radius:2px; letter-spacing:.04em}
.tag.no{background:color-mix(in srgb,var(--crit) 14%,transparent); color:var(--crit)}
.tag.yes{background:color-mix(in srgb,var(--good) 16%,transparent); color:var(--good)}

/* ── 목록 ── */
ul.tight{margin:4px 0 0; padding-left:0; list-style:none}
ul.tight li{
  position:relative; padding-left:19px; margin-bottom:9px; color:var(--ink-2); max-width:68ch;
}
ul.tight li::before{
  content:""; position:absolute; left:2px; top:.62em; width:6px; height:6px;
  border-radius:50%; background:var(--rule-2);
}
ul.tight li.ok::before{background:var(--good)}
ul.tight li.bad::before{background:var(--crit)}

/* ── 격자도 ── */
.trayfig{display:flex; gap:26px; flex-wrap:wrap; align-items:flex-start}
.traybox{flex:0 0 auto}
.traynotes{flex:1 1 240px; min-width:0}

/* ── 마무리 ── */
.closing{border:2px solid var(--ink); border-radius:4px; padding:28px 26px; margin-top:32px; background:var(--surface)}
.closing h2{margin-top:0}
.tooltip{
  position:fixed; pointer-events:none; z-index:50; opacity:0; transition:opacity .1s;
  background:var(--ink); color:var(--ground); font-family:"IBM Plex Mono",monospace;
  font-size:11.5px; line-height:1.5; padding:7px 10px; border-radius:3px; white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
@media (max-width:560px){
  .slide{padding:20px 17px 22px}
  body{padding-left:16px; padding-right:16px}
}

.note{font-size:12.5px; color:var(--muted); margin-top:10px; line-height:1.55;
  border-left:2px solid var(--rule-2); padding-left:12px}
.note b{color:var(--ink-2); font-weight:600}
